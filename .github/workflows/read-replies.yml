name: Read Replies (3 times a day)

# WHEN THIS RUNS
#   - Automatically at 07:45, 12:45 and 17:45 UTC (8:45 am, 1:45 pm and 6:45 pm in Lagos),
#     every day including weekends.
#   - Also inside "Send Emails (Weekdays)", just before any email goes out.
#   - Any time you like: Actions tab, "Read Replies (3 times a day)", "Run workflow".
#     A run started by hand is a PREVIEW unless you pick "Real run" in the box.
on:
  schedule:
    - cron: "45 7,12,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview changes nothing and sends nothing. Real run updates the Sheet and emails alerts."
        type: choice
        options:
          - "Preview only"
          - "Real run"
        default: "Preview only"

concurrency:
  group: read-replies
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install "gspread>=6,<7" "requests>=2.31" "dnspython>=2.4"

      - name: Read replies
        env:
          NAIRAHOST_MAIL_PASSWORD: ${{ secrets.NAIRAHOST_MAIL_PASSWORD }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'Real run' && 'yes' || 'no' }}
        run: python read_replies.py
